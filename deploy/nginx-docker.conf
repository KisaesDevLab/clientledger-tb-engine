# HSTS only when the request reached the edge over HTTPS. The proxy in front
# (Cloudflare / Caddy) talks plain HTTP to this port and says which scheme the
# browser used; the appliance's emergency path http://<lan-ip>:5172 must stay
# plain HTTP, so the header is never sent there. nginx omits an add_header
# whose value is empty.
map $http_x_forwarded_proto $vibe_hsts {
    default "";
    https   "max-age=31536000";
}

server {
    listen 80;
    server_name _;

    # Serve React frontend
    root /usr/share/nginx/html;
    index index.html;

    # Security headers for the SPA's own files. API responses (/api/, /auth/,
    # /mcp/) get theirs from helmet in the Express app, so the proxied
    # locations are left alone. KEEP THIS LIST IDENTICAL to the copy inside
    # `location = /index.html` below and to the other nginx config
    # (nginx.conf / nginx-docker.conf) — nginxSecurityHeaders.test.ts checks.
    #
    # - COOP is same-origin-allow-popups, not same-origin: the single sign-on
    #   test popup crosses to the identity provider and must post back.
    # - Permissions-Policy keeps publickey-credentials-* for passkeys.
    # - CSP is Report-Only until production use shows a clean console.
    # - No HTTP->HTTPS redirect here: TLS ends upstream and the emergency
    #   port has to keep answering over plain HTTP.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), publickey-credentials-get=(self), publickey-credentials-create=(self)" always;
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Strict-Transport-Security $vibe_hsts always;
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; frame-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;

    # Backup / restore endpoints handle .tbak archives up to ~500 MB. Keep this
    # block BEFORE the generic /api/ block so it wins the location match.
    location /api/v1/backup/ {
        proxy_pass http://api:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        client_max_body_size 500M;
    }
    location /api/v1/restore/ {
        proxy_pass http://api:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        client_max_body_size 500M;
    }

    # Import endpoints run OCR / vision pipelines that can take many minutes
    # on a multi-page PDF. Must win the location match over generic /api/.
    location /api/v1/import/ {
        proxy_pass http://api:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
        client_max_body_size 50M;
    }

    # Support chat is Server-Sent Events. nginx's default proxy_buffering=on
    # would hold every SSE chunk until the response completed, defeating the
    # whole point of streaming. Default timeouts (60s) also kill long Claude
    # responses mid-stream. Must win the location match over generic /api/.
    location /api/v1/support/chat {
        proxy_pass http://api:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Desktop sync (desktop-sync-addendum.md, docs/desktop-sync.md): a send-back
    # arrives in parts of up to 50 MB (SYNC_PART_BYTES, at most 95 MB) and a
    # pulled period downloads as one archive. Every call returns within
    # seconds (pulls and send-backs are jobs the desktop polls), so the
    # timeouts stay short; bodies stream instead of buffering to disk.
    location /api/v1/sync/ {
        proxy_pass http://api:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        client_max_body_size 96M;
    }

    # API proxy to Node.js backend (Docker service name)
    location /api/ {
        proxy_pass http://api:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_bypass $http_upgrade;
        client_max_body_size 50M;
    }

    # Vibe Auth (single sign-on). Its routes live on the API outside /api/:
    # /auth/status, the /auth/oidc/* browser flow (start, callback, logout,
    # back-channel) and the admin /auth/settings API. The SPA has no /auth/*
    # route of its own.
    location /auth/ {
        proxy_pass http://api:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # MCP (Model Context Protocol) — SSE requires no buffering and long timeouts
    location /mcp/ {
        proxy_pass http://api:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        client_max_body_size 10M;
    }

    # ES module assets. nginx's bundled mime.types has no entry for `.mjs`
    # (checked against nginx 1.29), so it falls through to
    # `default_type application/octet-stream` — and a browser refuses to execute
    # a module script served with that Content-Type, which is what breaks the
    # pdf.js worker with "Failed to fetch dynamically imported module".
    #
    # Scoped to a location on purpose: a `types { ... }` block at server level
    # REPLACES the whole inherited table rather than adding to it, which would
    # silently un-type every other asset. A regex location also wins over the
    # `/` prefix match, so the file is served rather than falling into the
    # SPA's try_files → index.html.
    location ~ \.mjs$ {
        default_type application/javascript;
    }

    # The SPA entry point must never be cached. It is the file that names the
    # hashed asset bundle, so a stale copy pins a browser to a previous deploy;
    # with no Cache-Control header at all a browser applies HEURISTIC caching
    # and invents a lifetime from Last-Modified, which is how a client can keep
    # running an old build for days after a fix ships. It is also rewritten in
    # place at container start (deploy/web-entrypoint.sh substitutes the
    # __VIBE_BASE_PATH__ sentinel), so its bytes can change without its name.
    location = /index.html {
        add_header Cache-Control "no-store" always;
        # A location with its own add_header inherits NONE from the server
        # block, and every SPA route lands here through try_files — so the
        # security headers are repeated in full.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), publickey-credentials-get=(self), publickey-credentials-create=(self)" always;
        add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Strict-Transport-Security $vibe_hsts always;
        add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; frame-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
    }

    # React Router — serve index.html for all frontend routes
    location / {
        try_files $uri $uri/ /index.html;
    }
}
